name: Release

# This workflow handles latest, beta, and alpha releases:
# - Latest: Triggered by GitHub releases (tag vX.Y.Z)
# - Beta: Triggered by pushes to beta-X.Y.Z branches
# - Alpha: Triggered by pushes to alpha-X.Y.Z branches

on:
  release:
    types: [published]
  push:
    branches:
      - beta-*.*.*
      - alpha-*.*.*

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'homebridge-plugins/homebridge-eufy'
      && !(github.event_name == 'release' && github.event.release.prerelease)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # OIDC trusted publishing needs npm >= 11.5.1. The major is pinned rather than tracking
      # `npm@latest`, because npm's output contracts move across majors while this repository's gate reads
      # them: npm 12 returns `npm pack --json` as an object where 11 returns an array, so `npm@latest`
      # fails the packed-artifact contracts here while the same tree passes under the npm the runner and
      # every developer already has. An unpinned toolchain also means the release job runs code nobody
      # chose, on the one workflow that publishes.
      - name: Install an npm that can do OIDC
        run: |
          set -euo pipefail
          npm install -g npm@^11
          need=11.5.1
          have="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "::error::npm $have is below the $need floor for OIDC trusted publishing"
            exit 1
          fi
          echo "npm $have — OIDC capable"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The gate reads a real version banner off the binary the plugin ships, and `ffmpeg-for-homebridge`
      # carries none in its tarball: its install script downloads it. `--ignore-scripts` above is what keeps
      # every other dependency from running code on this runner.
      - name: Fetch the bundled FFmpeg binary
        run: npm rebuild ffmpeg-for-homebridge

      # The gate runs here, at the exact commit being published, before anything touches the registry.
      # `prepublishOnly` runs it again with release qualification during `npm publish`, which is what covers a
      # publication that did not come through this workflow.
      - name: Verify
        run: npm run verify

      - name: Determine release type
        id: release-type
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "type=latest" >> $GITHUB_OUTPUT
            echo "tag=latest" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/beta-* ]]; then
            echo "type=beta" >> $GITHUB_OUTPUT
            echo "tag=beta" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/alpha-* ]]; then
            echo "type=alpha" >> $GITHUB_OUTPUT
            echo "tag=alpha" >> $GITHUB_OUTPUT
          else
            echo "type=none" >> $GITHUB_OUTPUT
            echo "tag=none" >> $GITHUB_OUTPUT
            echo "No valid release type detected - skipping publish"
          fi

      - name: Handle prerelease versioning
        if: steps.release-type.outputs.type == 'beta' || steps.release-type.outputs.type == 'alpha'
        run: |
          # Download versioning script from homebridge/.github
          mkdir -p .github
          wget -q https://raw.githubusercontent.com/homebridge/.github/latest/.github/npm-version-script-esm.js -O .github/npm-version-script-esm.js

          # Run the script to set base version
          node .github/npm-version-script-esm.js ${{ github.ref }} ${{ steps.release-type.outputs.type }}

          # Add prerelease suffix
          npm version pre --preid=${{ steps.release-type.outputs.type }} --no-git-tag-version

      - name: Publish to npm with OIDC
        if: steps.release-type.outputs.type != 'none'
        run: npm publish --tag ${{ steps.release-type.outputs.tag }} --provenance --access public
