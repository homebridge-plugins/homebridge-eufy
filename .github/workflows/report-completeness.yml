name: Report completeness

# A report whose form asked for a diagnostics archive cannot be triaged without one, and the form's own
# `required` validation cannot tell an attachment from a sentence. This checks the one thing it cannot, and
# says so on the issue: no archive means the report waits on its reporter rather than on a maintainer.
#
# The archive may arrive in a later comment, so every event re-reads the whole thread and the label follows
# what is there now. Nothing here judges the archive's contents.

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  issues: write

concurrency:
  group: report-completeness-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  completeness:
    runs-on: ubuntu-latest
    steps:
      - name: Check for a diagnostics archive
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (issue.pull_request) {
              return;
            }

            // Only a report whose form asked for the archive is judged on whether one arrived, which keeps
            // this off device-support requests and off issues opened without a template. Both labels are
            // matched because reports filed against the previous form say "File".
            if (!/^###\s+Diagnostics (?:Archive|File)\s*$/im.test(issue.body || '')) {
              core.info(`#${issue.number} was not asked for an archive`);
              return;
            }

            // A GitHub upload of a file, which is where a diagnostics archive lands whatever it is called;
            // an image or a pasted screenshot lands under `assets/` instead. Matching the upload rather than
            // an extension keeps this working across the v4 `.tar.gz` and the v5 `.eufysupport.gz`.
            const ATTACHED_FILE = /github\.com\/user-attachments\/files\/\d+\//;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            });
            const attached =
              ATTACHED_FILE.test(issue.body || '') || comments.some((comment) => ATTACHED_FILE.test(comment.body || ''));

            const labels = (issue.labels || []).map((label) => (typeof label === 'string' ? label : label.name));
            const waiting = labels.includes('needs-info');
            const request = { owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number };

            if (attached) {
              core.info(`#${issue.number} has an archive`);
              if (waiting) {
                await github.rest.issues.removeLabel({ ...request, name: 'needs-info' });
                await github.rest.issues.addLabels({ ...request, labels: ['needs-triage'] });
              }
              return;
            }

            // Already asked. Saying it again on every edit and every comment would be the loudest possible
            // way to add nothing.
            if (waiting) {
              core.info(`#${issue.number} is already waiting on its reporter`);
              return;
            }

            await github.rest.issues.createComment({
              ...request,
              body: [
                'Thanks for the report. Before anyone can look into this, it needs the **diagnostics archive** — the form asked for one and none is attached.',
                '',
                'To produce it: open the plugin settings, select the device that is misbehaving, click **Run diagnostics**, and follow it through. Reproduce the problem once while it is collecting, then drag the file it gives you into a comment here.',
                '',
                'It is encrypted and redacted: no serial numbers, addresses, tokens or login details, and the plugin uploads nothing anywhere.',
                '',
                'Without it the logs that would say which part failed do not exist, and the likely causes are indistinguishable from the outside. This issue stays open and will pick itself back up as soon as the file lands.',
              ].join('\n'),
            });
            await github.rest.issues.addLabels({ ...request, labels: ['needs-info'] });
            for (const name of ['needs-triage', 'needs triage']) {
              if (labels.includes(name)) {
                await github.rest.issues.removeLabel({ ...request, name });
              }
            }
