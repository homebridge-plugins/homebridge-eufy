name: 🐛 Bug Report
description: Report a bug or unexpected behavior
type: Bug
labels: ["needs triage"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight Checklist
      options:
        - label: I have searched the [existing issues](https://github.com/homebridge-plugins/homebridge-eufy/issues) and this bug has not been reported before.
          required: true
        - label: I am using a **dedicated guest admin account** (not my main Eufy account).
          required: true
        - label: I have restarted Homebridge and the issue persists.
          required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "The diagnostics archive carries these too, but fill them in so triage can start without opening it."
      value: |
        - **Plugin Version**: 
        - **Homebridge Version**: 
        - **Node.js Version**: 
        - **OS**: 
        - **Support Case ID** (shown when the archive is created): 
      render: markdown
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which area is affected?
      options:
        - Installation / Setup
        - Login / Authentication
        - Livestream / Streaming
        - Motion / Doorbell / Sensor events
        - Snapshots
        - Recording
        - Talkback
        - Security Modes
        - Device Discovery
        - Device controls
        - HomeKit Integration
        - Plugin UI / Dashboard
        - Diagnostics
        - Other
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics Archive
      description: "Open the plugin settings, select the device that is misbehaving, click **Run diagnostics**, and follow it through. Drag the `homebridge-eufy-<case-id>.eufysupport.gz` file it gives you into this box. It is encrypted, nothing was uploaded, and it does not contain your serial numbers, addresses or login details."
      placeholder: "Drag the .eufysupport.gz file here..."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug, what you expected, and how to reproduce it. Attach logs or screenshots if possible.
      placeholder: |
        **What happened:**
        Describe the issue...

        **What I expected:**
        ...

        **Steps to reproduce:**
        1. ...
        2. ...
    validations:
      required: true
