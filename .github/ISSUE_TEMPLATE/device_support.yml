name: 📱 Device Support Request
description: Request support for a new device type
type: Feature
labels: ["device-support", "needs triage"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight Checklist
      options:
        - label: I have searched the [existing issues](https://github.com/homebridge-plugins/homebridge-eufy/issues?q=label%3Adevice-support) and this device has not been requested before.
          required: true
        - label: I have checked [supported capabilities](https://homebridge-plugins.github.io/homebridge-eufy/reference/supported-capabilities) and understand a recognized device is not automatically represented in HomeKit.
          required: true

  - type: textarea
    id: device_info
    attributes:
      label: Device Information
      description: "Paste the device info JSON from the plugin UI (click 'Copy to Clipboard' on the unsupported device page)."
      render: json
    validations:
      required: true

  - type: dropdown
    id: dashboard_status
    attributes:
      label: How does the plugin currently show it?
      options:
        - "Not listed in the dashboard at all"
        - "Listed, marked Diagnostic only"
        - "Listed, but with fewer controls than expected"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Any other details about this device — what it does, how it connects, etc.
